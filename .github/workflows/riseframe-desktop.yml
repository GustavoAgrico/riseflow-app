# Gera o instalador do Riseframe para PC (Windows) e Mac a cada atualização do
# código do Riseframe no master, e publica em Releases (link fixo para baixar).
# Também dá para rodar na mão: Actions → "Riseframe Desktop" → Run workflow.
name: Riseframe Desktop

on:
  push:
    branches: [master]
    paths:
      - 'riseframe/**'
      - '.github/workflows/riseframe-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riseframe-desktop
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riseframe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis portable
            files: |
              riseframe/dist/builds/*.exe
          - os: macos-latest
            target: --mac dmg --arm64
            files: |
              riseframe/dist/builds/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: riseframe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Versão
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Dependências
        run: npm install --no-audit --no-fund

      - name: Build do site + instalador
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # No CI o electron-builder copia por hard link (Mac/Linux) e falha com EEXIST
          # quando o mesmo arquivo do web/dist entra duas vezes (workspaces). Cópia normal
          # sobrescreve sem erro, como no Windows.
          USE_HARD_LINKS: 'false'
        run: npm run build && npx electron-builder ${{ matrix.target }} --publish never

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: riseframe-v${{ steps.ver.outputs.version }}
          name: Riseframe ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** baixe `Riseframe-Setup-${{ steps.ver.outputs.version }}.exe` e instale (pode instalar por cima da versão antiga; suas chaves e vídeos continuam).
            Se o Windows avisar, clique em **Mais informações → Executar assim mesmo**.
            Sem instalar: `Riseframe-Portatil-${{ steps.ver.outputs.version }}.exe`.

            **Mac (Apple Silicon M1/M2/M3/M4):** baixe o `.dmg`, arraste o Riseframe para Aplicativos.
            Na 1ª vez, se o Mac disser que o app "está danificado" ou "não pode ser aberto", abra o Terminal e rode:
            `xattr -cr /Applications/Riseframe.app`
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
