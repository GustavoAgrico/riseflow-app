    <style>
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      html { scroll-behavior: smooth; }
      body {
        background: #08080C;
        color: #F4F4F8;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Fundo premium: brilhos laranja sobre preto profundo */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(60% 55% at 82% -8%, rgba(194, 65, 12, 0.20), transparent 60%),
          radial-gradient(55% 50% at 12% 4%, rgba(255, 107, 53, 0.18), transparent 58%),
          radial-gradient(70% 60% at 50% 118%, rgba(255, 106, 26, 0.10), transparent 60%),
          #08080C;
      }

      /* Scrollbar refinada */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.18); background-clip: padding-box; }

      ::selection { background: rgba(255, 107, 53, 0.32); color: #fff; }

      input[type='range'] { accent-color: #FF6A1A; }

      /* Celular: margens menores nas páginas internas (a barra de abas já reserva o rodapé) */
      @media (max-width: 820px) {
        .rf-page { padding: 20px 16px 32px !important; }
        /* Linhas de opção (exceto interruptores): rótulo em cima, controle na largura toda */
        .rf-row:not(:has(.rf-toggle)) { flex-wrap: wrap; gap: 10px !important; }
        .rf-row:not(:has(.rf-toggle)) > .rf-row-ctl { flex-basis: 100%; }
        .rf-row:not(:has(.rf-toggle)) > .rf-row-ctl > * { justify-content: flex-start !important; }
        /* Editor: título de marketing menor; some de vez durante a edição */
        .rf-hero { margin-bottom: 20px !important; }
        .rf-hero-title { font-size: 30px !important; letter-spacing: -0.9px !important; }
        .rf-hero-chips { display: none !important; }
        .rf-hero-compact { display: none !important; }
        .rf-select { width: 100%; min-width: 0 !important; font-size: 16px !important; min-height: 44px; }
        button, a, input, select { -webkit-tap-highlight-color: transparent; }
        /* iOS dá zoom ao focar campos com fonte < 16px */
        input:not([type='range']):not([type='checkbox']):not([type='file']), textarea, select { font-size: 16px !important; }
      }

      @keyframes rf-fade-up {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes rf-fade {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes rf-shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes rf-float {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-5px); }
      }
      @keyframes rf-pulse-glow {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
      }
      @keyframes rf-spin { to { transform: rotate(360deg); } }

      .rf-anim { animation: rf-fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
        html { scroll-behavior: auto; }
      }
