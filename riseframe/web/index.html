<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riseframe — Editor de vídeo com IA</title>
    <meta name="description" content="Do upload ao vídeo pronto: corte de pausas, legendas dinâmicas, B-roll e color grade cinematográfico — no navegador." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      html { scroll-behavior: smooth; }
      body {
        background: #08080C;
        color: #F4F4F8;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Fundo premium: mesh de brilhos laranja/roxo sobre preto profundo */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(60% 55% at 82% -8%, rgba(124, 58, 237, 0.22), transparent 60%),
          radial-gradient(55% 50% at 12% 4%, rgba(255, 107, 53, 0.18), transparent 58%),
          radial-gradient(70% 60% at 50% 118%, rgba(124, 58, 237, 0.16), transparent 60%),
          #08080C;
      }

      /* Scrollbar refinada */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.18); background-clip: padding-box; }

      ::selection { background: rgba(255, 107, 53, 0.32); color: #fff; }

      input[type='range'] { accent-color: #FF6B35; }

      @keyframes rf-fade-up {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes rf-fade {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes rf-shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes rf-float {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-5px); }
      }
      @keyframes rf-pulse-glow {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
      }
      @keyframes rf-spin { to { transform: rotate(360deg); } }

      .rf-anim { animation: rf-fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
        html { scroll-behavior: auto; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
