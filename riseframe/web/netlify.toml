# Deploy do FRONTEND do Riseframe na Netlify (grátis).
# IMPORTANTE: a Netlify hospeda só o site estático. O BACKEND (Express + FFmpeg +
# Whisper) NÃO roda aqui — hospede-o no Render (ver render.yaml) e informe a URL
# dele na variável VITE_API_URL (Site settings → Environment variables).
#
# No Netlify, defina o "Base directory" = riseframe/web (Site settings → Build).
# Este arquivo é lido a partir desse base, então os caminhos abaixo são relativos
# a ele (NÃO repita "riseframe/web" no `base`, senão vira caminho duplicado).

[build]
  command = "npm run build"       # a Netlify roda `npm install` sozinha
  publish = "dist"                # relativo ao base (riseframe/web/dist)

[build.environment]
  NODE_VERSION = "20"

# SPA: qualquer rota cai no index.html (o app é single-page).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
