# Render Blueprint do Riseframe — um único serviço Docker que builda o frontend
# e serve o site (dist) + a API (/api) na MESMA porta. Sobe tudo junto.
#
# COMO USAR (recomendado: serviço manual, por causa do monorepo):
#   Render → New → Web Service → conecte GustavoAgrico/riseflow-app
#   • Root Directory: riseframe
#   • Runtime: Docker   • Dockerfile: Dockerfile
#   • Plan: Free
#   • Health Check Path: /api/health
#   Depois adicione as variáveis abaixo em Environment.
# (Este arquivo serve de referência do que configurar.)
#
# ⚠️ PLANO FREE: 512 MB de RAM, sem disco persistente e "dorme" quando ocioso.
#   - Sem disco: usuários cadastrados e renders são temporários (somem no restart).
#   - Vídeo é pesado (CPU/RAM): o free serve para testar. Para uso real, suba o
#     plano (Starter+) e adicione um disco em /app/data (ver bloco comentado).

services:
  - type: web
    name: riseframe
    runtime: docker
    plan: free
    rootDir: riseframe
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: "*"               # frontend é servido junto (mesma origem)
      - key: OUTPUT_TTL_HOURS
        value: 6                 # limpa renders antigos (disco efêmero pequeno no free)
      - key: AUTH_SECRET
        generateValue: true      # mantém os logins válidos entre reinícios (sem disco)
      # ── Transcrição (legendas reais) ──
      # No free (512 MB) use o modelo 'tiny'. Se der OOM/crash, troque
      # TRANSCRIBE_PROVIDER para 'mock' (o app funciona, legendas de exemplo) ou
      # suba o plano. O servidor também cai para 'mock' sozinho se o Whisper falhar.
      - key: TRANSCRIBE_PROVIDER
        value: whisper-local
      - key: WHISPER_MODEL
        value: tiny
      # ── Chaves opcionais (configure no dashboard, não no repo) ──
      # - key: PEXELS_API_KEY      # B-roll automático
      #   sync: false
      # - key: ANTHROPIC_API_KEY   # correção de fala + color grade por IA
      #   sync: false
      # ── Assinatura (AbacatePay) — sem a chave, o site fica liberado como antes ──
      # ⚠️ Assinaturas ficam em data/billing.json: ANTES de cobrar, ative o disco
      #   (bloco abaixo). No free sem disco, quem pagou perde o acesso a cada deploy.
      # - key: ABACATE_PAY_API_KEY     # mesma chave do RiseFlow (app.abacatepay.com → API)
      #   sync: false
      # - key: ABACATE_WEBHOOK_SECRET  # invente um valor; use o mesmo no webhook da AbacatePay:
      #   sync: false                  #   https://SEU-APP.onrender.com/api/billing/webhook?webhookSecret=VALOR
      # - key: APP_URL                 # para onde o cliente volta após pagar
      #   value: https://SEU-APP.onrender.com
      # - key: ADMIN_EMAILS            # contas com acesso liberado sem pagar (separe por vírgula)
      #   value: seu-email@exemplo.com
      # - key: BILLING_PRICE_CENTS     # preço em centavos (4990 = R$ 49,90)
      #   value: 4990
      # - key: BILLING_PERIOD_DAYS     # dias liberados por pagamento
      #   value: 30
      # - key: BILLING_FREE_VIDEOS     # vídeos grátis por conta antes de pedir assinatura
      #   value: 3
      # - key: BILLING_METHODS         # PIX,CREDIT_CARD (ou só PIX se o cartão não estiver liberado)
      #   value: PIX,CREDIT_CARD

    # ── Para uso REAL (plano pago): descomente o disco e suba o modelo ──
    # plan: starter
    # disk:
    #   name: riseframe-data
    #   mountPath: /app/data       # guarda usuários, uploads e renders de forma persistente
    #   sizeGB: 10
    # (e troque WHISPER_MODEL para 'base' ou 'small' para legendas melhores)
