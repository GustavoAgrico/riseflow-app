# Riseframe — deploy num servidor próprio (VPS da Hostinger, Oracle, etc.).
# Sobe DOIS contêineres:
#   • app   → o Riseframe (site + API + FFmpeg) na porta interna 4000
#   • caddy → proxy com HTTPS AUTOMÁTICO e grátis (Let's Encrypt)
#
# Uso (dentro de riseframe/deploy):
#   cp .env.example .env    # e preencha (ou rode ./install.sh, que faz tudo)
#   docker compose up -d --build
#
# TODAS as variáveis do .env vão para o app (env_file) — chave nova no .env não precisa
# mexer aqui. Os dados (contas, planos, vídeos) ficam no volume persistente riseframe_data.

services:
  app:
    build:
      context: ..              # a pasta riseframe/ (onde está o Dockerfile)
      dockerfile: Dockerfile
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
      # site e API na MESMA origem (o Caddy serve tudo)
      CORS_ORIGIN: "https://${SITE_ADDRESS}"
      APP_URL: "https://${SITE_ADDRESS}"
    expose:
      - "4000"                 # só interno; quem publica na internet é o Caddy
    volumes:
      - riseframe_data:/app/data   # contas, planos, uploads, renders e demo — persistentes

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      SITE_ALIASES: ${SITE_ALIASES:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # certificados HTTPS (não apagar!)
      - caddy_config:/config

volumes:
  riseframe_data:
  caddy_data:
  caddy_config:
