appId: com.riseframe.desktop
productName: Riseframe
directories:
  buildResources: assets
  output: dist/builds

files:
  - package.json
  - web/dist/**/*
  - electron/**/*
  - assets/icon.png
  - assets/icon.ico
  - shared/**/*
  - server/src/**/*
  - server/assets/**/*
  - server/requirements.txt
  - server/package.json
  - node_modules/**/*
  - server/node_modules/**/*
  # Atalhos dos workspaces (node_modules/@riseframe/*) não entram no pacote.
  - "!node_modules/@riseframe/**"

extraMetadata:
  main: electron/main.js

asar: false

# Ícone oficial (logo Riseframe). Gerado de assets/icon.svg.
icon: assets/icon.png

# ffprobe-static traz o ffprobe de TODOS os sistemas (~230 MB): cada instalador leva só o seu.
win:
  icon: assets/icon.ico
  files:
    - "!node_modules/ffprobe-static/bin/darwin/**"
    - "!node_modules/ffprobe-static/bin/linux/**"
  target:
    - nsis
    - portable

# Nomes sem espaço (o GitHub troca espaço por ponto nos links de download).
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Riseframe
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico

portable:
  artifactName: ${productName}-Portatil-${version}.${ext}

mac:
  files:
    - "!node_modules/ffprobe-static/bin/win32/**"
    - "!node_modules/ffprobe-static/bin/linux/**"
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  category: public.app-category.video
  icon: assets/icon.png

dmg:
  contents:
    - x: 110
      y: 150
      type: file
    - x: 240
      y: 150
      type: link
      path: /Applications

linux:
  files:
    - "!node_modules/ffprobe-static/bin/win32/**"
    - "!node_modules/ffprobe-static/bin/darwin/**"
  target:
    - AppImage
    - deb
  category: Video

appImage:
  artifactName: ${productName}-${version}.${ext}

deb:
  artifactName: ${productName}-${version}.${ext}

# Sem publicação automática (o instalador fica em dist/builds). Sem isto o
# electron-builder tenta achar um repositório GitHub e o build falha no final.
publish: null
