appId: com.riseframe.desktop
productName: Riseframe
directories:
  buildResources: assets
  output: dist/builds

files:
  - package.json
  - web/dist/**/*
  - electron/**/*
  - server/src/**/*
  - server/package.json
  - node_modules/**/*
  - server/node_modules/**/*

extraMetadata:
  main: electron/main.js

asar: false

win:
  target:
    - nsis
    - portable
  certificateFile: null
  certificatePassword: null
  signingHashAlgorithms:
    - sha256

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Riseframe

mac:
  target:
    - dmg
    - zip
  category: public.app-category.video
  icon: assets/icon.icns

dmg:
  contents:
    - x: 110
      y: 150
      type: file
    - x: 240
      y: 150
      type: link
      path: /Applications

linux:
  target:
    - AppImage
    - deb
  category: Video

appImage:
  artifactName: ${productName}-${version}.${ext}

deb:
  artifactName: ${productName}-${version}.${ext}

publish:
  provider: github
